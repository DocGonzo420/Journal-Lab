<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Journal Lab</title>
<meta name="description" content="Make printable dot grid, ruled, Cornell, checklist, daily and weekly journal pages at any size, laid out on US Letter, A4 or A5 with cut marks.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#eceff3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1319" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Journal Lab">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a drafting-table tool. Live paper preview pinned on top (phone) or at right (desktop),
   controls in collapsible sections beneath, one sticky action bar for the PDF. */
:root{
  --bg:#eceff3; --panel:#ffffff; --field:#f3f5f9; --sunken:#d8dee7; --ink:#141922; --muted:#566074; --rule:#cbd3de;
  --accent:#2446c8; --accent-ink:#ffffff; --accent-soft:#e0e7fc; --warn:#7a4e00; --warn-soft:#fbeed0;
  --font:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(20,25,34,.14),0 10px 28px rgba(20,25,34,.16);
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1319; --panel:#171c24; --field:#0f1319; --sunken:#0a0d11; --ink:#e8ecf2; --muted:#9aa4b5; --rule:#2a3240;
    --accent:#86a0ff; --accent-ink:#0b1022; --accent-soft:#1f2a4d; --warn:#f0c36a; --warn-soft:#3a2f12;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1319; --panel:#171c24; --field:#0f1319; --sunken:#0a0d11; --ink:#e8ecf2; --muted:#9aa4b5; --rule:#2a3240;
  --accent:#86a0ff; --accent-ink:#0b1022; --accent-soft:#1f2a4d; --warn:#f0c36a; --warn-soft:#3a2f12;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:flex;flex-direction:column;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{padding-block:14px 6px;min-width:0}
.top h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
.sub{margin:2px 0 0;font:400 12px var(--mono);color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:10px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border:1px solid var(--rule);border-radius:999px;background:var(--panel);cursor:pointer;font-size:13px;white-space:nowrap}
.chip:hover{border-color:var(--accent)}

.preview{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;min-width:0}
.bar{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg button{min-height:38px;padding:0 14px;border:0;background:transparent;cursor:pointer;font-size:14px}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
.pager{display:inline-flex;align-items:center;gap:2px}
.pager button{width:38px;height:38px;border:1px solid var(--rule);border-radius:9px;background:var(--panel);cursor:pointer;font-size:20px;line-height:1}
.pager button:disabled{opacity:.35;cursor:default}
.pager span{min-width:92px;text-align:center;font:400 12px var(--mono);color:var(--muted)}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;min-height:38px}
.chk input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.spacer{flex:1}
.btn{min-height:42px;padding:0 16px;border:1px solid var(--rule);border-radius:9px;background:var(--panel);cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{min-height:36px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.6;cursor:default}
.stage{display:grid;place-items:center;background:var(--sunken);border-radius:var(--r);height:clamp(210px,38vh,380px);overflow:hidden}
.stage svg{display:block;background:#fff;box-shadow:var(--shadow);max-width:none}
.preview.collapsed .stage{display:none}
.info{margin:8px 0 0;font:400 12px/1.5 var(--mono);color:var(--muted)}
.note{margin:6px 0 0;padding:8px 10px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:13px}

.controls{min-width:0;padding-bottom:12px}
details.sec{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);margin-top:10px}
details.sec>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:50px;padding:0 14px;cursor:pointer;font-weight:600}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
details.sec[open]>summary::after{transform:rotate(-135deg)}
.sec-body{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px;padding:2px 14px 16px}
.field{min-width:0}
.field.wide{grid-column:1/-1}
.lab{display:block;margin:0 0 5px;font-size:12px;color:var(--muted);letter-spacing:.02em}
input[type=text],input[type=number],select,textarea{width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--field)}
textarea{font:400 12px/1.4 var(--mono);min-height:120px;resize:vertical}
select{appearance:auto}
.inwrap{position:relative}
.inwrap input{padding-right:38px;font-family:var(--mono);font-size:14px}
.unit{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:400 12px var(--mono);color:var(--muted);pointer-events:none}
.rangerow{display:flex;align-items:center;gap:12px}
.rangerow input{flex:1;min-width:0;accent-color:var(--accent);height:34px}
.rangerow output{min-width:64px;text-align:right;font:400 13px var(--mono)}
.sw-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--rule);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
input[type=color]{width:42px;height:34px;padding:2px;border:1px solid var(--rule);border-radius:8px;background:var(--field)}
.hint{margin:0;font-size:13px;color:var(--muted)}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--field)}
.row span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row div{display:flex;gap:6px;flex:none}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.parts{display:grid;gap:8px;margin-bottom:8px}
.part-row{display:grid;grid-template-columns:18px minmax(0,1fr) 68px auto;gap:8px;align-items:center}
.part-n{font:400 12px var(--mono);color:var(--muted);text-align:right}

.actions{position:sticky;bottom:0;z-index:5;display:flex;gap:10px;padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.actions .btn{flex:1}
.toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:fit-content;max-width:min(440px,100%);background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:10px;font-size:14px;z-index:20;box-shadow:var(--shadow)}

@media (min-width:900px){
  html,body{height:100%}
  .app{display:grid;height:100%;max-width:1480px;margin:0 auto;column-gap:22px;
    grid-template-columns:minmax(340px,410px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
    grid-template-areas:"top preview" "controls preview" "actions preview"}
  .top{grid-area:top}
  .controls{grid-area:controls;overflow-y:auto;padding-right:2px}
  .actions{grid-area:actions;position:static}
  .preview{grid-area:preview;position:static;display:flex;flex-direction:column;height:100%;min-height:0;padding-block:14px}
  .stage{flex:1;height:auto;min-height:0}
  #collapse{display:none}
}
@media (prefers-reduced-motion:reduce){details.sec>summary::after{transition:none}}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.titlerow h1{min-width:0}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="titlerow">
      <h1>Journal Lab</h1>
      <button type="button" class="btn small" id="btnInstall" hidden>Install app</button>
    </div>
    <p class="sub" id="subline">any page size · print on Letter, A4 or A5</p>
    <div class="chips" id="starters" role="group" aria-label="Starting points"></div>
  </header>

  <section class="preview" id="preview" aria-label="Preview">
    <div class="bar">
      <div class="seg" role="group" aria-label="Preview mode">
        <button type="button" id="mPage" aria-pressed="true">Page</button>
        <button type="button" id="mSheet" aria-pressed="false">Sheet</button>
      </div>
      <div class="pager">
        <button type="button" id="prev" aria-label="Previous">&#8249;</button>
        <span id="pagerLbl"></span>
        <button type="button" id="next" aria-label="Next">&#8250;</button>
      </div>
      <label class="chk"><input type="checkbox" id="guides" checked> Margins</label>
      <span class="spacer"></span>
      <button type="button" class="btn small" id="collapse">Hide preview</button>
    </div>
    <div class="stage" id="stage" aria-live="polite"></div>
    <p class="info" id="info"></p>
    <p class="note" id="note" hidden></p>
  </section>

  <main class="controls" id="controls"></main>

  <footer class="actions">
    <button type="button" class="btn primary" id="btnPdf">Download PDF</button>
    <button type="button" class="btn" id="btnShare" hidden>Save or print PDF</button>
  </footer>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="vendor/jspdf.umd.min.js"></script>
<script>
(function(){
'use strict';

/* =====================================================================
   1. Constants and settings model
   All geometry is in millimetres. Line weights are stored in points.
   ===================================================================== */
const PT = 25.4/72, IN = 25.4;
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const clone = o => JSON.parse(JSON.stringify(o));

const PAPERS = {
  letter:{l:'US Letter', w:215.9, h:279.4},
  a4:{l:'A4', w:210, h:297},
  a5:{l:'A5', w:148, h:210}
};

const PRESETS = [
  {g:'ISO', items:[
    {k:'a4', l:'A4', w:210, h:297},
    {k:'a5', l:'A5 · Hobonichi Cousin', w:148, h:210},
    {k:'a6', l:'A6 · Hobonichi Original', w:105, h:148},
    {k:'b5', l:'B5', w:176, h:250},
    {k:'b6', l:'B6', w:125, h:176}]},
  {g:'US', items:[
    {k:'letter', l:'US Letter', w:215.9, h:279.4},
    {k:'half', l:'Half Letter · 5.5 × 8.5 in', w:139.7, h:215.9},
    {k:'jr', l:'Junior Legal · 5 × 8 in', w:127, h:203.2},
    {k:'quarter', l:'Quarter Letter · 4.25 × 5.5 in', w:107.95, h:139.7}]},
  {g:'Notebook', items:[
    {k:'fn', l:'Field Notes · 3.5 × 5.5 in', w:88.9, h:139.7},
    {k:'pocket', l:'Pocket notebook · 90 × 140 mm', w:90, h:140},
    {k:'tn', l:'Passport Travelers Notebook · 89 × 124 mm', w:89, h:124},
    {k:'large', l:'Large notebook · 130 × 210 mm', w:130, h:210}]},
  {g:'Custom', items:[{k:'custom', l:'Custom size'}]}
];
const ALL_PRESETS = PRESETS.flatMap(g => g.items);
const presetLabel = k => (ALL_PRESETS.find(p => p.k === k) || {}).l || '';

const TEMPLATES = [
  {v:'dots', l:'Dot grid'}, {v:'grid', l:'Square grid'}, {v:'lgrid', l:'Corner grid (L marks)'}, {v:'lined', l:'Ruled lines'},
  {v:'cornell', l:'Cornell notes'}, {v:'checklist', l:'Checklist'},
  {v:'daily', l:'Daily planner'}, {v:'weekly', l:'Weekly planner'}, {v:'monthly', l:'Monthly calendar'},
  {v:'habit', l:'Habit tracker'}, {v:'tracker', l:'Tracker or log'}, {v:'title', l:'Title page'}, {v:'blank', l:'Blank'}
];
const tplName = v => (TEMPLATES.find(t => t.v === v) || {}).l || v;
/* Fonts. Helvetica, Times and Courier are built into PDFs; the others are open
   fonts (SIL Open Font License) loaded the first time they are picked. wf is a
   rough average letter width, used only to wrap long title page lines. */
const FONTS = {
  helvetica:{l:'Helvetica (clean sans)', css:'Helvetica,Arial,sans-serif', pdf:'helvetica', wf:0.56},
  times:{l:'Times (classic serif)', css:'"Times New Roman",Times,serif', pdf:'times', wf:0.5},
  courier:{l:'Courier (typewriter)', css:'"Courier New",Courier,monospace', pdf:'courier', wf:0.6},
  playfair:{l:'Playfair Display (elegant serif)', css:'"JL Playfair Display",Georgia,serif', file:'PlayfairDisplay', pkg:'playfair-display', wf:0.56},
  josefin:{l:'Josefin Sans (geometric)', css:'"JL Josefin Sans",Futura,sans-serif', file:'JosefinSans', pkg:'josefin-sans', wf:0.52},
  caveat:{l:'Caveat (handwriting)', css:'"JL Caveat",cursive', file:'Caveat', pkg:'caveat', wf:0.42},
  amatic:{l:'Amatic SC (hand-drawn capitals)', css:'"JL Amatic SC",cursive', file:'AmaticSC', pkg:'amatic-sc', wf:0.34}
};
const fontURL = (f,w) => 'vendor/fonts/'+f.file+'_'+w+'.ttf';
const SP_KEYS = ['dots','grid','lgrid','lined','cornell','checklist','habit','tracker'];

const DEFAULTS = {
  w:148, h:210, preset:'a5', unit:'mm',
  tpl:'dots',
  spacings:{dots:5, grid:5, lgrid:5, lined:7, cornell:7, checklist:9, habit:7, tracker:9},
  lgArm:60, lgShape:'l',
  tpTitle:'My Journal', tpSub:'', tpLine:'', tpV:'center', tpAlign:'center', tpSize:32, tpSubSize:13,
  tpCase:'normal', tpBold:true, tpRule:'line', tpRulePos:'between', tpRuleW:'short', tpFrame:'none', tpFields:'none',
  weight:0.4, intensity:70, color:'#6b7280',
  marginLine:false,
  cueW:45, summaryH:40, cornellLines:true, cornellLabels:true,
  cbSize:4.5,
  startHour:6, endHour:20, halfHours:true, hour24:false, priorities:true, dailyNotes:false,
  weekStart:1, weekLayout:'grid', trackKind:'mood',
  mt:12, mb:12, mi:14, mo:10, mirror:false,
  title:'', titleSize:12, headerNote:'', dateField:false, pageNums:'none', pageNumPlace:'footer', startNum:1,
  paper:'letter', sheetOrient:'auto', sheetMargin:5, gap:0, cutMarks:true, pages:4, fill:true,
  spread:false, booklet:false, bleedOn:false, bleed:2, shareCuts:false,
  dated:false, startDate:'', monthCal:true, monthFill:true,
  holes:'none', holeEdge:7,
  duplex:false, calFL:20, calFT:20, calBL:20, calBT:20,
  headFont:'helvetica', textFont:'helvetica',
  mix:false, parts:[{tpl:'monthly', n:1}, {tpl:'daily', n:7}, {tpl:'dots', n:4}]
};
const BOOLS = ['marginLine','cornellLines','cornellLabels','halfHours','hour24','priorities','dailyNotes','mirror','dateField','cutMarks','fill','spread','booklet','bleedOn','shareCuts','dated','monthCal','monthFill','duplex','mix','tpBold'];

function num(v,d,min,max){ v = +v; if(!isFinite(v)) v = d; return clamp(v,min,max); }

function sanitize(s){
  s.w = num(s.w,148,20,600); s.h = num(s.h,210,20,600);
  s.unit = s.unit === 'in' ? 'in' : 'mm';
  if(!ALL_PRESETS.some(p => p.k === s.preset)) s.preset = 'custom';
  if(!TEMPLATES.some(t => t.v === s.tpl)) s.tpl = 'dots';
  for(const k of SP_KEYS) s.spacings[k] = num(s.spacings[k], DEFAULTS.spacings[k], 1.5, 30);
  s.weight = num(s.weight,.4,.1,2); s.intensity = num(s.intensity,70,10,100);
  s.color = /^#[0-9a-f]{6}$/i.test(s.color) ? s.color : DEFAULTS.color;
  s.cueW = num(s.cueW,45,15,120); s.summaryH = num(s.summaryH,40,15,120); s.cbSize = num(s.cbSize,4.5,2,10);
  s.startHour = Math.round(num(s.startHour,6,0,23)); s.endHour = Math.round(num(s.endHour,20,1,24));
  if(s.endHour <= s.startHour) s.endHour = Math.min(24, s.startHour + 1);
  s.weekStart = +s.weekStart === 0 ? 0 : 1; s.weekLayout = s.weekLayout === 'rows' ? 'rows' : 'grid';
  for(const k of ['mt','mb','mi','mo']) s[k] = num(s[k],10,0,60);
  s.title = String(s.title || '').slice(0,60); s.titleSize = num(s.titleSize,12,8,36);
  if(!['none','outer','inner','center'].includes(s.pageNums)) s.pageNums = 'none';
  s.headerNote = String(s.headerNote || '').slice(0,60);
  s.pageNumPlace = s.pageNumPlace === 'header' ? 'header' : 'footer';
  if(!['mood','reading','log'].includes(s.trackKind)) s.trackKind = 'mood';
  s.lgArm = Math.round(num(s.lgArm,60,15,100)); s.lgShape = s.lgShape === 'cross' ? 'cross' : 'l';
  for(const k of ['tpTitle','tpSub','tpLine']) s[k] = String(s[k] == null ? DEFAULTS[k] : s[k]).slice(0,60);
  s.tpSize = num(s.tpSize,32,10,96); s.tpSubSize = num(s.tpSubSize,13,6,48);
  const pick = (k,list) => { if(!list.includes(s[k])) s[k] = DEFAULTS[k]; };
  pick('tpV',['top','upper','center','lower','bottom']); pick('tpAlign',['left','center','right']);
  pick('tpCase',['normal','upper','spaced']); pick('tpRule',['none','line','double','thickthin','dots','diamond']);
  pick('tpRulePos',['between','below','above','both']); pick('tpRuleW',['short','full']);
  pick('tpFrame',['none','single','double','corners']); pick('tpFields',['none','name','dates','both']);
  if(!FONTS[s.headFont]) s.headFont = 'helvetica'; if(!FONTS[s.textFont]) s.textFont = 'helvetica';
  s.parts = (Array.isArray(s.parts) ? s.parts : []).filter(pt => pt && typeof pt === 'object').slice(0,12)
    .map(pt => ({tpl: TEMPLATES.some(t => t.v === pt.tpl) ? pt.tpl : 'dots', n: Math.round(num(pt.n,1,1,200))}));
  if(!s.parts.length) s.parts = clone(DEFAULTS.parts);
  s.startNum = Math.round(num(s.startNum,1,0,9999));
  if(!PAPERS[s.paper]) s.paper = 'letter';
  if(!['auto','portrait','landscape'].includes(s.sheetOrient)) s.sheetOrient = 'auto';
  s.sheetMargin = num(s.sheetMargin,5,0,30); s.gap = num(s.gap,0,0,30);
  s.pages = Math.round(num(s.pages,4,1,200));
  s.bleed = num(s.bleed,2,0.5,6);
  if(!HOLES[s.holes]) s.holes = 'none'; s.holeEdge = num(s.holeEdge,7,4,15);
  for(const k of CAL_KEYS) s[k] = num(s[k],CAL_REF,CAL_REF-10,CAL_REF+10);
  s.startDate = /^\d{4}-\d{2}-\d{2}$/.test(s.startDate) && isFinite(Date.parse(s.startDate)) ? s.startDate : '';
  for(const k of BOOLS) s[k] = !!s[k];
  return s;
}
function merge(o){
  const s = clone(DEFAULTS);
  if(o && typeof o === 'object'){
    for(const k of Object.keys(o)){
      if(k === 'spacings'){ if(o[k] && typeof o[k] === 'object') Object.assign(s.spacings, o[k]); }
      else if(k in s) s[k] = o[k];
    }
  }
  return sanitize(s);
}
function diff(s){
  const d = {};
  for(const k of Object.keys(DEFAULTS)){
    if(k === 'spacings'){
      const sp = {}; for(const t of SP_KEYS) if(s.spacings[t] !== DEFAULTS.spacings[t]) sp[t] = s.spacings[t];
      if(Object.keys(sp).length) d.spacings = sp;
    } else if(JSON.stringify(s[k]) !== JSON.stringify(DEFAULTS[k])) d[k] = s[k];
  }
  return d;
}

/* =====================================================================
   2. Drawing primitives. Every template emits these; the SVG preview
   and the jsPDF exporter both consume the same list.
   ===================================================================== */
const L  = (x1,y1,x2,y2,w,c,dash) => ({k:'l',x1,y1,x2,y2,w,c,dash});
const D  = (x,y,r,c) => ({k:'d',x,y,r,c});
const RC = (x,y,w,h,lw,c,dash) => ({k:'r',x,y,w,h,lw,c,dash});
const O  = (x,y,r,lw,c) => ({k:'o',x,y,r,lw,c});
const T  = (x,y,s,size,c,a,b) => ({k:'t',x,y,s,size,c,a:a||'l',b:!!b});

function hexToRgb(hx){ const n = parseInt(hx.replace('#',''),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function rgbToHex(r,g,b){ return '#'+[r,g,b].map(v => Math.round(v).toString(16).padStart(2,'0')).join(''); }
function tint(hx,a){ const [r,g,b] = hexToRgb(hx); return rgbToHex(255-(255-r)*a, 255-(255-g)*a, 255-(255-b)*a); }
function darken(hx,f){ const [r,g,b] = hexToRgb(hx); return rgbToHex(r*f,g*f,b*f); }

const spacing = s => s.spacings[s.tpl] || 5;
const dotRadius = w => 0.1 + w*0.32;

/* Bleed: dot grid, square grid and ruled patterns can fill the page and run
   past its edges, so a slightly-off cut still looks clean. */
const BLEED_TPLS = ['dots','grid','lgrid','lined'];
/* Mixed pages: one PDF made of parts, each a run of pages of one type. */
const uses = (s,t) => s.mix ? s.parts.some(pt => pt.tpl === t) : s.tpl === t;
const bleedTpl = s => s.mix ? s.parts.some(pt => BLEED_TPLS.includes(pt.tpl)) : BLEED_TPLS.includes(s.tpl);
/* Printer calibration. The test sheet prints a line 20 mm from the left and top
   edges on each side of the paper; the distances measured with a ruler say how far
   the printer shifts each side, and the PDF shifts the other way to cancel it. */
const CAL_REF = 20, CAL_KEYS = ['calFL','calFT','calBL','calBT'];
const isBackFace = (s,pl,idx) => (!!pl.booklet || !!s.duplex) && idx % 2 === 0;
function calShift(s,back){
  return back ? {x:CAL_REF - s.calBL, y:CAL_REF - s.calBT} : {x:CAL_REF - s.calFL, y:CAL_REF - s.calFT};
}
const calOn = s => CAL_KEYS.some(k => Math.abs(s[k] - CAL_REF) > 1e-9);
/* One side of the printer test sheet, paper size w x h. */
function buildTestSheet(w,h,back,paperName){
  const ops = [], ink = '#222222', mute = '#666666', lw = 0.2, R = CAL_REF;
  const side = back ? 'BACK' : 'FRONT';
  // Margin ladders: lines 1 to 10 mm in from each edge, centred on that edge.
  for(let d=1; d<=10; d++){
    const big = d % 5 === 0, len = big ? 10 : 6;
    ops.push(L(w/2-len/2, d, w/2+len/2, d, lw, ink), L(w/2-len/2, h-d, w/2+len/2, h-d, lw, ink));
    ops.push(L(d, h/2-len/2, d, h/2+len/2, lw, ink), L(w-d, h/2-len/2, w-d, h/2+len/2, lw, ink));
    if(d === 1 || big){
      ops.push(T(w/2-len/2-1.5, d+0.7, String(d), 5, mute, 'r'), T(w/2-len/2-1.5, h-d+0.7, String(d), 5, mute, 'r'));
      ops.push(T(d, h/2-len/2-1.5, String(d), 5, mute, 'c'), T(w-d, h/2-len/2-1.5, String(d), 5, mute, 'c'));
    }
  }
  // Reference lines 20 mm from the left and top edges.
  ops.push(L(R, 40, R, h-40, 0.25, ink), L(40, R, w-40, R, 0.25, ink));
  ops.push(T(R+2, 46, 'This line should be 20 mm from the left edge', 7, ink));
  ops.push(T(46, R-2, 'This line should be 20 mm from the top edge', 7, ink));
  // Centre cross, to check front and back line up when held to the light.
  ops.push(L(w/2-15, h/2, w/2+15, h/2, 0.25, ink), L(w/2, h/2-15, w/2, h/2+15, 0.25, ink), O(w/2, h/2, 5, 0.25, ink));
  // 100 mm scale bar, to check the print was not scaled.
  const sx = w/2-50, sy = h/2+40;
  ops.push(L(sx, sy, sx+100, sy, 0.3, ink));
  for(let i=0;i<=10;i++) ops.push(L(sx+10*i, sy-(i%5 ? 1.5 : 3), sx+10*i, sy, 0.2, ink));
  ops.push(T(w/2, sy+5, 'This bar should be exactly 100 mm long. If not, print at 100% (Actual size).', 7, ink, 'c'));
  // Instructions.
  const tx = 46, ty = h/2-48;
  ops.push(T(tx, ty, 'Journal Lab printer test: '+side, 12, ink, 'l', true));
  const lines = back ? [
    'This is the back of the sheet. Hold the sheet to a light: the two centre',
    'crosses should sit on top of each other.',
    'Measure the two lines on this side from the paper edges, as you read this',
    'page, and enter them as the back measurements.'
  ] : [
    paperName+'. Print both pages double-sided at 100%, flipping on the',
    (w > h ? 'short' : 'long')+' edge. Use the same printer settings as your journal pages.',
    'Margins: the ladders at each edge have lines 1 to 10 mm in. The smallest',
    'number you can see fully is the most your printer cuts off on that side.',
    'Measure the two 20 mm lines with a ruler and enter them in Journal Lab.'
  ];
  // Narrow paper such as A5 gets smaller type so the lines stay on the sheet.
  const fs = w < 180 ? 6 : 7.5;
  lines.forEach((t,i) => ops.push(T(tx, ty+7+i*fs*0.56, t, fs, mute)));
  return ops;
}

/* Ring holes for loose-leaf planners. gaps are the distances between hole centres
   (mm), centred on the binding edge; r is the hole radius. Disc-bound punches set
   their own spacing, so that option only keeps the punch zone clear. */
const HOLES = {
  none:     {l:'None'},
  a5:       {l:'A5 six-ring (19 / 70 mm)', gaps:[19,19,70,19,19], r:2.9},
  personal: {l:'Personal or A6 six-ring (19 / 51 mm)', gaps:[19,19,51,19,19], r:2.75},
  pocket:   {l:'Pocket six-ring (19 mm)', gaps:[19,19,19,19,19], r:2.4},
  disc:     {l:'Disc-bound (keep the punch zone clear)', zone:12}
};
const holesOf = s => s.spread || s.holes === 'none' ? null : HOLES[s.holes];
/* Distance from the binding edge that must stay free of content. */
function holeZone(s){
  const H = holesOf(s); if(!H) return 0;
  return H.zone || s.holeEdge + H.r + 3;
}
/* Hole centres along the binding edge, centred on the page; ones that would fall off the page are dropped. */
function holeYs(s){
  const H = holesOf(s); if(!H || !H.gaps) return {ys:[], all:0};
  const span = H.gaps.reduce((a,b) => a+b, 0);
  const ys = [s.h/2 - span/2]; for(const g of H.gaps) ys.push(ys[ys.length-1] + g);
  return {ys: ys.filter(y => y - H.r >= 0.5 && y + H.r <= s.h - 0.5), all: ys.length};
}
const bleedOf = s => s.bleedOn && bleedTpl(s) ? s.bleed : 0;
/* Booklet spreads: two pages side by side, folded at the spine. */
const pieceW = s => s.spread ? 2*s.w : s.w;
/* Saddle-stitch booklet: spreads printed on both sides of the paper, in the
   order that lets the stack fold into one booklet. Folded sheet f (0 = outside)
   carries pages N-2f and 2f+1 on its front, 2f+2 and N-2f-1 on its back. */
const isBooklet = s => !!(s.spread && s.booklet);
function bookletSide(k, n){
  const f = Math.floor((k-1)/2);
  return (k-1) % 2 === 0 ? [n-2*f, 2*f+1] : [2*f+2, n-2*f-1];
}

function contentRect(s,p,inner){
  const innerLeft = inner ? inner === 'left' : (!s.mirror || (p % 2 === 1));
  const mi = Math.max(s.mi, holeZone(s));
  const l = innerLeft ? mi : s.mo, r = innerLeft ? s.mo : mi;
  return {x:l, y:s.mt, w:Math.max(1, s.w-l-r), h:Math.max(1, s.h-s.mt-s.mb), innerLeft};
}

/* Where a page shares a cut line with its neighbour, the pattern is anchored to
   that line so the dots or lines sit half a step from it on both pages and the
   pattern reads as one across the cut. Otherwise it is centred. */
function fit(a0, len, sp, anchor){
  if(anchor == null){ const n = Math.floor(len/sp + 1e-9) + 1; return [a0 + (len - (n-1)*sp)/2, n]; }
  const st = anchor + sp/2 + Math.ceil((a0 - anchor - sp/2)/sp - 1e-9)*sp;
  return [st, Math.max(0, Math.floor((a0 + len - st)/sp + 1e-9) + 1)];
}

const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

/* Dated pages: daily, weekly and monthly pages can carry real dates. Dates are
   whole days in UTC so they never shift with time zones or daylight saving. */
const DATED_TPLS = ['daily','weekly','monthly','habit','tracker'];
/* Pages that cover a whole month: one page per month. */
const MONTH_TPLS = ['monthly','habit','tracker'];
const DAY_MS = 864e5;
const datedTpl = (s,t) => DATED_TPLS.includes(t) && (t !== 'tracker' || s.trackKind === 'mood');
const isDated = s => !!s.dated && (s.mix ? s.parts.some(pt => datedTpl(s, pt.tpl)) : datedTpl(s, s.tpl));
const hasMonthCal = s => !s.mix && isDated(s) && s.monthCal && !MONTH_TPLS.includes(s.tpl);
function startOf(s){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s.startDate || '');
  if(m) return new Date(Date.UTC(+m[1], +m[2]-1, +m[3]));
  const t = new Date(); return new Date(Date.UTC(t.getFullYear(), t.getMonth(), 1));
}
const addDays = (d,n) => new Date(d.getTime() + n*DAY_MS);
const weekOf = (d,ws) => addDays(d, -((d.getUTCDay() - ws + 7) % 7));
const monthEnd = d => new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+1, 0));
const dayLabel = d => DAYS[d.getUTCDay()]+', '+MONTHS[d.getUTCMonth()]+' '+d.getUTCDate();
function weekLabel(a){
  const b = addDays(a,6), ma = MONTHS[a.getUTCMonth()], mb = MONTHS[b.getUTCMonth()];
  return ma === mb ? ma+' '+a.getUTCDate()+' to '+b.getUTCDate()
                   : ma.slice(0,3)+' '+a.getUTCDate()+' to '+mb.slice(0,3)+' '+b.getUTCDate();
}
/* What page p shows: which template, and its date when dates are on. With a month
   calendar first, page 1 is the calendar and the dated pages start on page 2. */
/* Which part of a mixed set page p falls in, and its place among pages of the same
   type, so dated parts of one type carry on from each other. Pages past the end
   (filling the last sheet) continue the last part. */
function partAt(s,p){
  const seen = {}; let off = 0;
  for(let k=0; k<s.parts.length; k++){
    const pt = s.parts[k];
    if(p <= off + pt.n || k === s.parts.length - 1) return {tpl:pt.tpl, i:(seen[pt.tpl] || 0) + p - off, k};
    off += pt.n; seen[pt.tpl] = (seen[pt.tpl] || 0) + pt.n;
  }
}
function pageInfo(s,p){
  if(s.mix){
    const a = partAt(s,p);
    return Object.assign(pageInfo(Object.assign({}, s, {mix:false, tpl:a.tpl, monthCal:false}), a.i), {part:a.k});
  }
  if(!isDated(s)) return {tpl:s.tpl};
  let tpl = s.tpl, i = p;
  if(hasMonthCal(s)){ if(p === 1) tpl = 'monthly'; else i = p - 1; }
  const st = startOf(s);
  if(MONTH_TPLS.includes(tpl)){
    const m = new Date(Date.UTC(st.getUTCFullYear(), st.getUTCMonth() + (tpl === s.tpl ? i-1 : 0), 1));
    return {tpl, month:m, label:MONTHS[m.getUTCMonth()]+' '+m.getUTCFullYear()};
  }
  if(tpl === 'daily'){ const d = addDays(st, i-1); return {tpl, day:d, label:dayLabel(d)}; }
  const w = addDays(weekOf(st, s.weekStart), 7*(i-1));
  return {tpl, week:w, label:weekLabel(w)};
}
/* Pages to print: the number asked for, or with dates on, through the end of the start month. */
function pageCount(s){
  if(s.mix) return s.parts.reduce((a,pt) => a + pt.n, 0);
  if(!isDated(s) || !s.monthFill || MONTH_TPLS.includes(s.tpl)) return s.pages;
  const st = startOf(s), end = monthEnd(st), cal = hasMonthCal(s) ? 1 : 0;
  if(s.tpl === 'daily') return Math.round((end - st)/DAY_MS) + 1 + cal;
  return Math.round((weekOf(end, s.weekStart) - weekOf(st, s.weekStart))/(7*DAY_MS)) + 1 + cal;
}

const TPL = {
  blank(){},

  dots(s,B,C){
    const sp = spacing(s);
    const [ox, cols] = fit(B.x, B.w, sp, C.ax), [oy, rows] = fit(B.y, B.h, sp, C.ay);
    const r = dotRadius(s.weight);
    for(let j=0;j<rows;j++) for(let i=0;i<cols;i++) C.ops.push(D(ox+i*sp, oy+j*sp, r, C.line));
  },

  grid(s,B,C){
    const sp = spacing(s);
    const [ox, cols] = fit(B.x, B.w, sp, C.ax), [oy, rows] = fit(B.y, B.h, sp, C.ay);
    const x2 = ox + (cols-1)*sp, y2 = oy + (rows-1)*sp;
    for(let i=0;i<cols;i++) C.ops.push(L(ox+i*sp, oy, ox+i*sp, y2, C.lw, C.line));
    for(let j=0;j<rows;j++) C.ops.push(L(ox, oy+j*sp, x2, oy+j*sp, C.lw, C.line));
  },

  /* Corner grid: each square drawn as an L (its left and bottom sides), or a small
     cross at each grid point. Arm length is a share of the square; at 100% the
     L marks join into a grid with open top and right edges. */
  lgrid(s,B,C){
    const sp = spacing(s);
    const [ox, cols] = fit(B.x, B.w, sp, C.ax), [oy, rows] = fit(B.y, B.h, sp, C.ay);
    const a = sp*s.lgArm/100;
    if(s.lgShape === 'cross'){
      const h = a/2;
      for(let j=0;j<rows;j++) for(let i=0;i<cols;i++){
        const x = ox+i*sp, y = oy+j*sp;
        C.ops.push(L(x-h, y, x+h, y, C.lw, C.line), L(x, y-h, x, y+h, C.lw, C.line));
      }
      return;
    }
    for(let j=1;j<rows;j++) for(let i=0;i<cols-1;i++){
      const x = ox+i*sp, y = oy+j*sp;
      C.ops.push(L(x, y, x, y-a, C.lw, C.line), L(x, y, x+a, y, C.lw, C.line));
    }
  },

  lined(s,B,C){
    const sp = spacing(s);
    let y0 = B.y + sp, n = Math.floor(B.h/sp + 1e-9);
    if(C.ay != null) [y0, n] = fit(B.y, B.h, sp, C.ay);
    for(let i=0;i<n;i++) C.ops.push(L(B.x, y0+i*sp, B.x+B.w, y0+i*sp, C.lw, C.line));
    if(s.marginLine){ const mx = C.marginX != null ? C.marginX : B.x + Math.min(20, B.w*0.15); C.ops.push(L(mx, B.y, mx, y0+(n-1)*sp, C.lw, C.line)); }
  },

  cornell(s,B,C){
    const sp = spacing(s);
    const cw = clamp(s.cueW, 10, B.w*0.7), sh = clamp(s.summaryH, 10, B.h*0.6);
    const xd = B.x + cw, yd = B.y + B.h - sh;
    C.ops.push(L(xd, B.y, xd, yd, C.lw, C.line));
    C.ops.push(L(B.x, yd, B.x+B.w, yd, C.lw, C.line));
    if(s.cornellLabels){
      C.ops.push(T(B.x, B.y+3.4, 'CUES', 7, C.mute, 'l', true));
      C.ops.push(T(xd+2, B.y+3.4, 'NOTES', 7, C.mute, 'l', true));
      C.ops.push(T(B.x, yd+3.6, 'SUMMARY', 7, C.mute, 'l', true));
    }
    if(s.cornellLines){
      for(let y=B.y+sp; y<yd-0.01; y+=sp) C.ops.push(L(xd, y, B.x+B.w, y, C.lw, C.faint));
      for(let y=yd+sp; y<B.y+B.h+0.01; y+=sp) C.ops.push(L(B.x, y, B.x+B.w, y, C.lw, C.faint));
    }
  },

  checklist(s,B,C){
    const sp = spacing(s), n = Math.floor(B.h/sp + 1e-9);
    const cb = Math.min(s.cbSize, sp*0.8);
    for(let i=0;i<n;i++){
      const y = B.y + (i+1)*sp;
      C.ops.push(RC(B.x, y - sp/2 - cb/2, cb, cb, C.lw*1.3, C.line));
      C.ops.push(L(B.x+cb+3, y, B.x+B.w, y, C.lw, C.line));
    }
  },

  daily(s,B,C){
    let y = B.y;
    if(s.priorities){
      C.ops.push(T(B.x, y+3.2, 'TOP PRIORITIES', 7, C.mute, 'l', true));
      for(let i=0;i<3;i++){
        const yy = y + 10 + i*7.5;
        C.ops.push(T(B.x, yy-0.8, String(i+1), 8, C.mute));
        C.ops.push(L(B.x+5, yy, B.x+B.w, yy, C.lw, C.line));
      }
      y += 10 + 2*7.5 + 6;
    }
    const notesW = s.dailyNotes ? B.w*0.36 : 0, gap = s.dailyNotes ? 4 : 0;
    const sw = B.w - notesW - gap, tw = 11;
    const hours = Math.max(1, s.endHour - s.startHour), per = s.halfHours ? 2 : 1, rows = hours*per;
    const H = Math.max(10, B.y + B.h - y), rh = H/rows;
    for(let r=0;r<=rows;r++){
      const yy = y + r*rh, hourLine = r % per === 0;
      C.ops.push(L(B.x+tw, yy, B.x+sw, yy, C.lw, hourLine ? C.line : C.faint, hourLine ? null : [0.6,0.9]));
      if(hourLine && r < rows){
        const hr = s.startHour + r/per;
        const lab = s.hour24 ? String(hr).padStart(2,'0')+':00' : ((hr%12)||12)+' '+((hr%24)<12?'AM':'PM');
        C.ops.push(T(B.x, yy+3.2, lab, 7, C.mute));
      }
    }
    if(s.dailyNotes){
      C.ops.push(RC(B.x+sw+gap, y, notesW, H, C.lw, C.line));
      C.ops.push(T(B.x+sw+gap+2, y+3.6, 'NOTES', 7, C.mute, 'l', true));
    }
  },

  weekly(s,B,C,p,info){
    const order = [0,1,2,3,4,5,6].map(i => (s.weekStart + i) % 7);
    if(s.weekLayout === 'rows'){
      const rh = B.h/7;
      C.ops.push(L(B.x, B.y, B.x+B.w, B.y, C.lw, C.line));
      order.forEach((d,i) => {
        const y = B.y + i*rh;
        C.ops.push(T(B.x+1, y+3.8, DAYS[d].toUpperCase()+(info && info.week ? ' '+addDays(info.week,i).getUTCDate() : ''), 7, C.mute, 'l', true));
        C.ops.push(L(B.x, y+rh, B.x+B.w, y+rh, C.lw, C.line));
      });
    } else {
      const cols = B.w > B.h ? 4 : 2, rows = 8/cols, g = 3;
      const bw = (B.w - (cols-1)*g)/cols, bh = (B.h - (rows-1)*g)/rows;
      for(let k=0;k<8;k++){
        const c = k % cols, r = Math.floor(k/cols);
        const x = B.x + c*(bw+g), y = B.y + r*(bh+g);
        C.ops.push(RC(x, y, bw, bh, C.lw, C.line));
        C.ops.push(T(x+2, y+4, k < 7 ? DAYS[order[k]].toUpperCase()+(info && info.week ? ' '+addDays(info.week,k).getUTCDate() : '') : 'NOTES', 7, C.mute, 'l', true));
      }
    }
  },

  monthly(s,B,C,p,info){
    const order = [0,1,2,3,4,5,6].map(i => (s.weekStart + i) % 7);
    let y = B.y, first = 0, days = 0, rows = 5;
    if(info && info.month){
      days = monthEnd(info.month).getUTCDate();
      first = (info.month.getUTCDay() - s.weekStart + 7) % 7;
      rows = Math.ceil((first + days)/7);
    } else {
      C.ops.push(T(B.x, y+4.2, 'MONTH', 7, C.mute, 'l', true));
      C.ops.push(L(B.x+12, y+4.6, B.x+Math.min(B.w, 70), y+4.6, C.lw, C.line));
      y += 8;
    }
    const cw = B.w/7, hh = 5.5, rh = Math.max(4, (B.y + B.h - y - hh)/rows);
    order.forEach((d,i) => C.ops.push(T(B.x + i*cw + cw/2, y+3.8, cw < 10 ? DAYS[d].slice(0,1) : DAYS[d].slice(0,3).toUpperCase(), 7, C.mute, 'c', true)));
    const top = y + hh, bot = top + rows*rh;
    for(let r=0;r<=rows;r++) C.ops.push(L(B.x, top + r*rh, B.x+B.w, top + r*rh, C.lw, C.line));
    for(let c=0;c<=7;c++) C.ops.push(L(B.x + c*cw, top, B.x + c*cw, bot, C.lw, C.line));
    for(let d=1; d<=days; d++){
      const k = first + d - 1, c = k % 7, r = Math.floor(k/7);
      C.ops.push(T(B.x + c*cw + 1.2, top + r*rh + 3.4, String(d), 7, C.mute));
    }
  },

  /* Title page: up to three lines of text placed on the page, with dividers,
     a frame and fill-in lines. Its text uses the header font. */
  title(s,B,C){
    const font = FONTS[s.headFont] || FONTS.helvetica;
    const fmt = t => s.tpCase === 'normal' ? t : s.tpCase === 'upper' ? t.toUpperCase()
      : t.toUpperCase().split(' ').map(w => w.split('').join(' ')).join('   ');
    const HT = (x,y,str,size,c,a,b) => Object.assign(T(x,y,str,size,c,a,b), {f:'@head'});
    // Frame first, so the text block sits inside it.
    const ink = C.ink, rl = C.lw*1.4;
    if(s.tpFrame === 'single' || s.tpFrame === 'double'){
      C.ops.push(RC(B.x, B.y, B.w, B.h, rl, C.line));
      if(s.tpFrame === 'double') C.ops.push(RC(B.x+1.6, B.y+1.6, B.w-3.2, B.h-3.2, C.lw, C.line));
    } else if(s.tpFrame === 'corners'){
      const k = Math.min(14, B.w*0.15, B.h*0.15);
      for(const [cx,cy,dx,dy] of [[B.x,B.y,1,1],[B.x+B.w,B.y,-1,1],[B.x,B.y+B.h,1,-1],[B.x+B.w,B.y+B.h,-1,-1]])
        C.ops.push(L(cx, cy, cx+dx*k, cy, rl, C.line), L(cx, cy, cx, cy+dy*k, rl, C.line));
    }
    const pad = s.tpFrame === 'none' ? 0 : 8;
    const X = {x:B.x+pad, y:B.y+pad, w:Math.max(10, B.w-2*pad), h:Math.max(10, B.h-2*pad)};
    // Fill-in lines at the foot of the page.
    const fields = [];
    if(s.tpFields === 'name' || s.tpFields === 'both') fields.push(['Name']);
    if(s.tpFields === 'dates' || s.tpFields === 'both') fields.push(['From','To']);
    const fh = fields.length*9, fy0 = X.y + X.h - fh;
    fields.forEach((row,r) => {
      const y = fy0 + r*9 + 7, cw = X.w/row.length;
      row.forEach((lab,k) => {
        const x0 = X.x + k*cw, lx = x0 + Math.max(lab.length*8*PT*0.6, 6) + 2;
        C.ops.push(Object.assign(T(x0, y, lab, 8, C.mute), {f:'@head'}));
        C.ops.push(L(lx, y+0.6, x0 + cw - (k < row.length-1 ? 4 : 0), y+0.6, C.lw, C.line));

    });
    // Wrap the title to the width, at most three lines.
    const em = sz => sz*PT*font.wf;
    let size = s.tpSize;
    // Wrap by words, measuring each line as it will print (capitals, spacing).
    const wrap = (t,sz,maxW) => {
      const out = [];
      for(const w of t.split(/\s+/)){
        const cand = out.length ? out[out.length-1]+' '+w : w;
        if(out.length && fmt(cand).length*em(sz) > maxW) out.push(w); else if(out.length) out[out.length-1] = cand; else out.push(w);
      }
      return out.map(fmt);
    };
    const title = s.tpTitle.trim(), sub = fmt(s.tpSub.trim()), extra = s.tpLine.trim();
    let tl = title ? wrap(title, size, X.w) : [];
    while(tl.length > 3 || tl.some(l => l.length*em(size) > X.w)){ size *= 0.92; tl = wrap(title, size, X.w); if(size < 10) break; }
    const th = size*PT*1.18, sh = s.tpSubSize*PT*1.45, eh = s.tpSubSize*0.8*PT*1.5, ruleH = s.tpRule === 'none' ? 0 : 7;
    const pos = s.tpRulePos;
    const above = ruleH && (pos === 'above' || pos === 'both'), between = ruleH && pos === 'between' && (sub || extra),
          below = ruleH && (pos === 'below' || pos === 'both' || (pos === 'between' && !sub && !extra));
    const blockH = (above ? ruleH : 0) + tl.length*th + (between ? ruleH : 2) + (sub ? sh : 0) + (extra ? eh : 0) + (below ? ruleH : 0);
    const room = X.h - (fh ? fh + 6 : 0);
    const frac = {top:0, upper:0.3, center:0.5, lower:0.7, bottom:1}[s.tpV];
    let y = X.y + clamp(room*frac - blockH*frac, 0, Math.max(0, room - blockH));
    const ax = s.tpAlign === 'left' ? X.x : s.tpAlign === 'right' ? X.x + X.w : X.x + X.w/2;
    const al = s.tpAlign === 'left' ? 'l' : s.tpAlign === 'right' ? 'r' : 'c';
    const rw = s.tpRuleW === 'full' ? X.w : Math.min(X.w, Math.max(30, X.w*0.4));
    const rx = s.tpAlign === 'left' ? X.x : s.tpAlign === 'right' ? X.x + X.w - rw : X.x + (X.w - rw)/2;
    const rule = yy => {
      const st = s.tpRule, x1 = rx, x2 = rx + rw, mid = rx + rw/2;
      if(st === 'line') C.ops.push(L(x1, yy, x2, yy, rl, C.line));
      else if(st === 'double') C.ops.push(L(x1, yy-0.7, x2, yy-0.7, C.lw, C.line), L(x1, yy+0.7, x2, yy+0.7, C.lw, C.line));
      else if(st === 'thickthin') C.ops.push(L(x1, yy-0.6, x2, yy-0.6, rl*2.2, C.line), L(x1, yy+0.9, x2, yy+0.9, C.lw, C.line));
      else if(st === 'dots'){ const n = Math.max(3, Math.floor(rw/3)); for(let i=0;i<=n;i++) C.ops.push(D(x1 + i*rw/n, yy, Math.max(0.25, rl*0.6), C.line)); }
      else if(st === 'diamond'){
        const d = 1.8;
        C.ops.push(L(x1, yy, mid-d-1.2, yy, rl, C.line), L(mid+d+1.2, yy, x2, yy, rl, C.line));
        C.ops.push(L(mid-d, yy, mid, yy-d, rl, C.line), L(mid, yy-d, mid+d, yy, rl, C.line), L(mid+d, yy, mid, yy+d, rl, C.line), L(mid, yy+d, mid-d, yy, rl, C.line));
      }
    };
    if(above){ rule(y + ruleH/2); y += ruleH; }
    for(const l of tl){ y += th; C.ops.push(HT(ax, y - th*0.22, l, size, ink, al, s.tpBold)); }
    if(between){ rule(y + ruleH/2); y += ruleH; } else y += 2;
    if(sub){ y += sh; C.ops.push(HT(ax, y - sh*0.3, sub, s.tpSubSize, C.mute, al)); }
    if(extra){ y += eh; C.ops.push(HT(ax, y - eh*0.3, extra, s.tpSubSize*0.8, C.mute, al)); }
    if(below){ rule(y + ruleH/2); y += ruleH; }
  },

  /* Habit tracker: a habit on each row, a box for every day of the month. */
  habit(s,B,C,p,info){
    let y = B.y;
    const dated = !!(info && info.month), days = dated ? monthEnd(info.month).getUTCDate() : 31;
    if(!dated) y = monthLine(B,C);
    const nameW = clamp(B.w*0.28, 18, 45), x0 = B.x + nameW, cw = (B.w - nameW)/days;
    const fs = cw < 3.2 ? 5 : cw < 4.5 ? 6 : 7, hh = dated ? 8 : 5;
    const wd = d => dated ? addDays(info.month, d-1).getUTCDay() : null;
    if(dated) for(let d=1; d<=days; d++) C.ops.push(T(x0 + (d-0.5)*cw, y+3, DAYS[wd(d)].slice(0,1), fs, C.mute, 'c'));
    // Very narrow boxes label every other day so the numbers don't run together.
    const step = cw < 2.4 ? 2 : 1;
    for(let d=1; d<=days; d+=step) C.ops.push(T(x0 + (d-0.5)*cw, y+hh-1.2, String(d), fs, C.mute, 'c'));
    C.ops.push(T(B.x, y+hh-1.2, 'HABIT', 7, C.mute, 'l', true));
    const sp = spacing(s), top = y + hh + 0.8;
    const rows = Math.max(1, Math.floor((B.y + B.h - top)/sp + 1e-9)), bot = top + rows*sp;
    for(let r=0; r<=rows; r++) C.ops.push(L(B.x, top + r*sp, B.x+B.w, top + r*sp, C.lw, C.line));
    C.ops.push(L(x0, top, x0, bot, C.lw, C.line));
    // A darker line at the start of each week.
    for(let d=1; d<days; d++){
      const wk = dated ? wd(d+1) === s.weekStart : d % 7 === 0;
      C.ops.push(L(x0 + d*cw, top, x0 + d*cw, bot, C.lw, wk ? C.line : C.faint));
    }
    C.ops.push(L(B.x+B.w, top, B.x+B.w, bot, C.lw, C.line));
  },

  /* Tracker or log: a mood row for every day, a reading log, or a dated log. */
  tracker(s,B,C,p,info){
    let y = B.y;
    if(s.trackKind === 'mood'){
      const dated = !!(info && info.month), days = dated ? monthEnd(info.month).getUTCDate() : 31;
      if(!dated) y = monthLine(B,C);
      const hh = 5.5, rh = Math.max(2.2, (B.y + B.h - y - hh)/days);
      const r = clamp(rh*0.3, 0.8, 1.7), pitch = Math.max(2*r + 1.4, 4), dw = 10;
      const cx0 = B.x + dw + r + 0.5, noteX = cx0 + 4*pitch + r + 3;
      const fs = clamp(rh/PT*0.7, 5, 7);
      C.ops.push(T(B.x, y+3.8, 'DAY', 7, C.mute, 'l', true));
      for(let k=0;k<5;k++) C.ops.push(T(cx0 + k*pitch, y+3.8, String(k+1), 6, C.mute, 'c'));
      C.ops.push(T(noteX, y+3.8, 'NOTES', 7, C.mute, 'l', true));
      C.ops.push(L(B.x, y+hh, B.x+B.w, y+hh, C.lw, C.line));
      for(let d=0; d<days; d++){
        const yy = y + hh + d*rh, cy = yy + rh/2;
        const lab = String(d+1)+(dated ? ' '+DAYS[addDays(info.month, d).getUTCDay()].slice(0,1) : '');
        C.ops.push(T(B.x, cy + fs*PT*0.35, lab, fs, C.mute));
        for(let k=0;k<5;k++) C.ops.push(O(cx0 + k*pitch, cy, r, C.lw, C.line));
        C.ops.push(L(B.x, yy+rh, B.x+B.w, yy+rh, C.lw, C.faint));
      }
      return;
    }
    const sp = spacing(s), hh = 5.5, fs = B.w < 100 ? 5.5 : 7;
    const cols = s.trackKind === 'reading'
      ? [['TITLE',0.38],['AUTHOR',0.26],['START',0.12],['FINISH',0.12],['RATING',0.12]]
      : [['DATE',clamp(18/B.w, 0.12, 0.3)],['ENTRY',0]];
    if(!cols[cols.length-1][1]) cols[cols.length-1][1] = 1 - cols.slice(0,-1).reduce((a,c) => a + c[1], 0);
    const rows = Math.max(1, Math.floor((B.h - hh)/sp + 1e-9)), top = y + hh, bot = top + rows*sp;
    let x = B.x;
    cols.forEach(([name, f], k) => {
      const w = f*B.w;
      C.ops.push(T(x + (k ? 1.5 : 0), y+3.8, name, fs, C.mute, 'l', true));
      if(k) C.ops.push(L(x, top, x, bot, C.lw, C.faint));
      if(name === 'RATING' && w >= 12){
        const rr = 0.9, pt = (w - 3)/5;
        for(let r=0; r<rows; r++) for(let j=0;j<5;j++) C.ops.push(O(x + 1.5 + pt*(j+0.5), top + r*sp + sp/2, rr, C.lw, C.faint));
      }
      x += w;
    });
    C.ops.push(L(B.x, top, B.x+B.w, top, C.lw, C.line));
    for(let r=1; r<=rows; r++) C.ops.push(L(B.x, top + r*sp, B.x+B.w, top + r*sp, C.lw, C.line));
  }
};
/* A "Month" write-in line for undated month pages; returns where the page continues. */
function monthLine(B,C){
  C.ops.push(T(B.x, B.y+4.2, 'MONTH', 7, C.mute, 'l', true));
  C.ops.push(L(B.x+12, B.y+4.6, B.x+Math.min(B.w, 70), B.y+4.6, C.lw, C.line));
  return B.y + 8;
}

function buildPage(s,p,opt){
  opt = opt || {};
  const ops = [], R = contentRect(s,p,opt.inner);
  const line = tint(s.color, s.intensity/100);
  const C = {
    ops, line, lw: s.weight*PT,
    faint: tint(s.color, s.intensity/100*0.55),
    mute: tint(darken(s.color,0.8), Math.min(1, s.intensity/100+0.2)),
    ink: darken(s.color, 0.55)
  };
  let B = {x:R.x, y:R.y, w:R.w, h:R.h};
  // In a mixed set, or on a month calendar before dated pages, the page draws as its own type.
  const info = pageInfo(s,p), t = s.mix || info.tpl !== s.tpl ? Object.assign({}, s, {tpl:info.tpl, mix:false}) : s;
  const num = String(s.startNum + p - 1), sub = v => v.replace(/\{n\}/gi, num).trim();
  const title = sub(s.title), note = sub(s.headerNote), head = info.label || '';
  const numHead = s.pageNums !== 'none' && s.pageNumPlace === 'header';
  const numRight = s.pageNums === 'outer' ? R.innerLeft : !R.innerLeft;
  const isTitle = info.tpl === 'title';
  const band = !isTitle && !!(title || s.dateField || head || note || numHead);
  const headStart = ops.length;
  if(band){
    const hh = Math.max(9, s.titleSize*PT*1.9 + 2), base = R.y + hh - 3.2;
    // A dated page leads with its date; a page title moves to the right in small type.
    // A page number in the header takes the outer, inner or centre spot and the rest moves aside.
    let xl = R.x, xr = R.x + R.w, numOp = null;
    if(numHead){
      const nw = num.length*8*PT*0.56 + 3;
      if(s.pageNums === 'center') numOp = T(R.x + R.w/2, base, num, 8, C.ink, 'c');
      else if(numRight){ numOp = T(xr, base, num, 8, C.ink, 'r'); xr -= nw; }
      else { numOp = T(xl, base, num, 8, C.ink, 'l'); xl += nw; }
    }
    const main = head || title, small = [head ? title : '', note].filter(Boolean).join('  \u00b7  ');
    const dateOn = s.dateField && !head;
    if(main) ops.push(T(xl, base, main, s.titleSize, C.ink, 'l', true));
    if(small) ops.push(T(dateOn ? xr - 38 : xr, base, small, 8, C.mute, 'r'));
    if(dateOn){
      ops.push(T(xr-34, base, 'Date', 8, C.ink));
      ops.push(L(xr-27, base+0.5, xr, base+0.5, C.lw, C.line));
    }
    if(numOp) ops.push(numOp);
    ops.push(L(R.x, R.y+hh-1.2, R.x+R.w, R.y+hh-1.2, C.lw, C.line));
    for(let i=headStart; i<ops.length; i++) if(ops[i].k === 't') ops[i].f = '@head';
    B = {x:R.x, y:R.y+hh, w:R.w, h:Math.max(1, R.h-hh)};
  }
  const bl = bleedOf(t);
  if(bl){
    // Fill the page and run past its edges. In a spread the spine side keeps its margin.
    // Edges shared with a neighbouring page (fewer-cuts layout) stop exactly at the page edge.
    const sd = opt.sides || {}, out = k => sd[k] === false ? 0 : bl;
    const keep = !!opt.spread || !!holesOf(s);
    const spineLeft = keep && R.innerLeft, spineRight = keep && !R.innerLeft;
    const x1 = spineLeft ? B.x : -out('l'), x2 = spineRight ? B.x + B.w : s.w + out('r');
    const y1 = band ? B.y : -out('t');
    B = {x:x1, y:y1, w:x2-x1, h:s.h + out('b') - y1};
    if(sd.l === false) C.ax = 0; else if(sd.r === false) C.ax = s.w;
    if(sd.t === false) C.ay = 0; else if(sd.b === false) C.ay = s.h;
    C.marginX = R.x + Math.min(20, R.w*0.15);
  }
  TPL[info.tpl](t,B,C,p,info);
  const H = holesOf(s);
  if(H){
    // Punch marks on the binding edge: an outlined hole with a small cross at its centre.
    const hc = '#8a8a8a', hw = 0.2;
    if(H.gaps){
      const x = R.innerLeft ? s.holeEdge : s.w - s.holeEdge;
      for(const y of holeYs(s).ys){
        ops.push(O(x, y, H.r, hw, hc));
        ops.push(L(x-0.8, y, x+0.8, y, hw, hc), L(x, y-0.8, x, y+0.8, hw, hc));
      }
    } else {
      const x = R.innerLeft ? H.zone - 2 : s.w - H.zone + 2;
      ops.push(L(x, 0, x, s.h, hw, hc, [1,1.5]));
    }
  }
  if(s.pageNums !== 'none' && !numHead && !isTitle){
    const yb = s.h - clamp(s.mb/2, 3, 8) + 1;
    if(s.pageNums === 'center') ops.push(T(s.w/2, yb, num, 8, C.ink, 'c'));
    else ops.push(T(numRight ? R.x+R.w : R.x, yb, num, 8, C.ink, numRight ? 'r' : 'l'));
  }
  if(opt.guides) ops.push(RC(R.x, R.y, R.w, R.h, 0.18, '#3b82f6', [1.2,1.2]));
  // Fonts: header text and title pages use the header font, everything else the text font.
  for(const o of ops) if(o.k === 't'){
    const k = o.f === '@head' ? s.headFont : s.textFont;
    if(k && k !== 'helvetica') o.f = k; else delete o.f;
  }
  return ops;
}

/* One printed piece: a single page, or a booklet spread of two pages with
   fold ticks at the spine. Piece k holds pages 2k-1 and 2k. */
function buildPiece(s,k,opt){
  opt = opt || {};
  if(!s.spread) return buildPage(s,k,opt);
  if(isBooklet(s)){ const [lp, rp] = bookletSide(k, opt.bn || plan(s).bpages); return buildPair(s, lp, rp, opt); }
  return buildPair(s, 2*k-1, 2*k, opt);
}
function buildPair(s,lp,rp,opt){
  const ops = [], bl = bleedOf(s), sd = opt.sides || {};
  const half = side => Object.assign({}, opt, {inner:side, spread:true, sides:Object.assign({}, sd, side === 'right' ? {r:true} : {l:true})});
  place(buildPage(s, lp, half('right')), 0, 0, 1, ops);
  place(buildPage(s, rp, half('left')), s.w, 0, 1, ops);
  const tt = clamp(s.mt*0.4, 2, 4), tb = clamp(s.mb*0.4, 2, 4);
  ops.push(L(s.w, sd.t === false ? 0 : -bl, s.w, tt, 0.25, '#555555'));
  ops.push(L(s.w, s.h - tb, s.w, s.h + (sd.b === false ? 0 : bl), 0.25, '#555555'));
  if(opt.guides) ops.push(L(s.w, 0, s.w, s.h, 0.18, '#3b82f6', [1.2,1.2]));
  return ops;
}

/* =====================================================================
   3. Sheet layout: how many pages fit on Letter, A4 or A5, and where
   ===================================================================== */
function plan(s){
  const bl = bleedOf(s);
  const P = PAPERS[s.paper], sm = s.sheetMargin, g = s.shareCuts ? 0 : Math.max(s.gap, 2*bl), pw = pieceW(s), ph = s.h, eps = 1e-6;
  const mk = (sw,sh) => {
    const cols = Math.max(0, Math.floor((sw-2*sm+g+eps)/(pw+g)));
    const rows = Math.max(0, Math.floor((sh-2*sm+g+eps)/(ph+g)));
    const sc = Math.min(1, (sw-2*sm)/pw, (sh-2*sm)/ph);
    return {sw,sh,cols,rows,sc,n:cols*rows};
  };
  const por = mk(P.w,P.h), lan = mk(P.h,P.w);
  let pick;
  if(s.sheetOrient === 'portrait') pick = por;
  else if(s.sheetOrient === 'landscape') pick = lan;
  else if(lan.n > por.n) pick = lan;
  else if(lan.n === por.n && lan.n === 0 && lan.sc > por.sc) pick = lan;
  else pick = por;
  let cols = pick.cols, rows = pick.rows, sc = 1, scaled = false;
  if(cols < 1 || rows < 1){
    // A page as big as the paper (an A5 page on A5 paper) prints at full size, edge to edge.
    // Only one that is bigger than the paper itself is shrunk to fit.
    const full = (s.sheetOrient === 'landscape' ? [lan] : s.sheetOrient === 'portrait' ? [por] : [por, lan])
      .find(o => pw <= o.sw + eps && ph <= o.sh + eps);
    if(full) pick = full; else { sc = Math.max(0.05, pick.sc); scaled = true; }
    cols = 1; rows = 1;
  }
  const per = cols*rows;
  let total, sheets, booklet = null;
  if(isBooklet(s)){
    // Pages round up to a multiple of 4 (one folded sheet each), or up to full paper sheets.
    let folios = Math.ceil(pageCount(s)/4);
    const paper = Math.ceil(folios/per);
    if(s.fill) folios = paper*per;
    booklet = {pages:4*folios, folios, paper};
    total = 2*folios; sheets = 2*paper;
  } else {
    const want = s.spread ? Math.ceil(pageCount(s)/2) : pageCount(s);
    total = s.fill ? Math.ceil(want/per)*per : want;
    sheets = Math.ceil(total/per);
  }
  const pageW = pw*sc, pageH = ph*sc;
  const tw = cols*pageW + (cols-1)*g, th = rows*pageH + (rows-1)*g;
  // Straight cuts to free every page: shared lines count once, gaps need two cuts each.
  const cuts = g > 0 ? 2*cols + 2*rows : cols + rows + 2;
  return {sw:pick.sw, sh:pick.sh, cols, rows, per, sc, scaled, total, sheets, pageW, pageH, tw, th,
          ox:(pick.sw-tw)/2, oy:(pick.sh-th)/2, paper:P.l, landscape:pick.sw > pick.sh, gap:g, bleed:bl, cuts,
          booklet, bpages:booklet ? booklet.pages : 0};
}

function place(ops,tx,ty,sc,out){
  for(const o of ops){
    switch(o.k){
      case 'l': out.push({k:'l',x1:tx+o.x1*sc,y1:ty+o.y1*sc,x2:tx+o.x2*sc,y2:ty+o.y2*sc,w:o.w*sc,c:o.c,dash:o.dash}); break;
      case 'd': out.push({k:'d',x:tx+o.x*sc,y:ty+o.y*sc,r:o.r*sc,c:o.c}); break;
      case 'r': out.push({k:'r',x:tx+o.x*sc,y:ty+o.y*sc,w:o.w*sc,h:o.h*sc,lw:o.lw*sc,c:o.c,dash:o.dash}); break;
      case 'o': out.push({k:'o',x:tx+o.x*sc,y:ty+o.y*sc,r:o.r*sc,lw:o.lw*sc,c:o.c}); break;
      case 't': out.push({k:'t',x:tx+o.x*sc,y:ty+o.y*sc,s:o.s,size:o.size*sc,c:o.c,a:o.a,b:o.b,f:o.f}); break;
    }
  }
}

function buildSheet(s,pl,idx,preview,guides){
  const ops = [], start = (idx-1)*pl.per, B = pl.booklet;
  // In a booklet, sheet j front and back are faces 2j-1 and 2j. Slot i holds folded
  // sheet i*paper + j, so each cut pile is a run of nested sheets. The back is mirrored
  // left to right so each spread lands behind its own front.
  const j = B ? Math.ceil(idx/2) - 1 : 0, back = !!B && idx % 2 === 0;
  for(let i=0;i<pl.per;i++){
    let p = start + i + 1;
    if(B){ const f = i*B.paper + j; if(f >= B.folios) continue; p = 2*f + (back ? 2 : 1); }
    else if(p > pl.total) break;
    const c0 = i % pl.cols, c = back ? pl.cols - 1 - c0 : c0, r = Math.floor(i/pl.cols);
    const tx = pl.ox + c*(pl.pageW + pl.gap), ty = pl.oy + r*(pl.pageH + pl.gap);
    const share = pl.gap === 0;
    const sides = {l:!share || c === 0, r:!share || c === pl.cols-1, t:!share || r === 0, b:!share || r === pl.rows-1};
    place(buildPiece(s,p,{guides, sides, bn:pl.bpages}), tx, ty, pl.sc, ops);
    if(preview) ops.push(RC(tx, ty, pl.pageW, pl.pageH, 0.2, '#9aa4b5', [1.5,1.5]));
  }
  if(s.cutMarks && !preview){
    const o = pl.bleed*pl.sc + 1.2, len = Math.min(4, Math.min(pl.ox, pl.oy) - o - 0.6);
    if(len >= 1.5){
      const xs = new Set(), ys = new Set(), q = v => Math.round(v*100)/100;
      for(let c=0;c<pl.cols;c++){ const x = pl.ox + c*(pl.pageW+pl.gap); xs.add(q(x)); xs.add(q(x+pl.pageW)); }
      for(let r=0;r<pl.rows;r++){ const y = pl.oy + r*(pl.pageH+pl.gap); ys.add(q(y)); ys.add(q(y+pl.pageH)); }
      const mw = 0.15, mc = '#555555';
      xs.forEach(x => { ops.push(L(x, pl.oy-o-len, x, pl.oy-o, mw, mc)); ops.push(L(x, pl.oy+pl.th+o, x, pl.oy+pl.th+o+len, mw, mc)); });
      ys.forEach(y => { ops.push(L(pl.ox-o-len, y, pl.ox-o, y, mw, mc)); ops.push(L(pl.ox+pl.tw+o, y, pl.ox+pl.tw+o+len, y, mw, mc)); });
    }
  }
  if(!preview && calOn(s)){
    const d = calShift(s, isBackFace(s,pl,idx));
    if(d.x || d.y){ const out = []; place(ops, d.x, d.y, 1, out); return out; }
  }
  return ops;
}

   4. Renderers: SVG for the preview, jsPDF for the export

const f3 = n => +n.toFixed(3);
const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function toSVG(ops,w,h){
  const lines = new Map(), dots = new Map();
  let shapes = '';
  for(const o of ops){
    if(o.k === 'l'){
      const key = f3(o.w)+'|'+o.c+'|'+(o.dash ? o.dash.join(' ') : '');
      let a = lines.get(key); if(!a){ a = []; lines.set(key,a); }
      a.push('M'+f3(o.x1)+' '+f3(o.y1)+'L'+f3(o.x2)+' '+f3(o.y2));
    } else if(o.k === 'd'){
      const key = f3(o.r)+'|'+o.c;
      let a = dots.get(key); if(!a){ a = []; dots.set(key,a); }
      a.push('M'+f3(o.x)+' '+f3(o.y)+'h.01');
    } else if(o.k === 'r'){
      shapes += '<rect x="'+f3(o.x)+'" y="'+f3(o.y)+'" width="'+f3(o.w)+'" height="'+f3(o.h)+'" fill="none" stroke="'+o.c+'" stroke-width="'+f3(o.lw)+'"'+(o.dash ? ' stroke-dasharray="'+o.dash.join(' ')+'"' : '')+'/>';
    } else if(o.k === 'o'){
      shapes += '<circle cx="'+f3(o.x)+'" cy="'+f3(o.y)+'" r="'+f3(o.r)+'" fill="none" stroke="'+o.c+'" stroke-width="'+f3(o.lw)+'"/>';
    } else if(o.k === 't'){
      shapes += '<text x="'+f3(o.x)+'" y="'+f3(o.y)+'" font-size="'+f3(o.size*PT)+'" font-family=\''+(FONTS[o.f] || FONTS.helvetica).css+'\' font-weight="'+(o.b?700:400)+'" fill="'+o.c+'" text-anchor="'+(o.a==='c'?'middle':o.a==='r'?'end':'start')+'">'+esc(o.s)+'</text>';
    }
  }
  let body = '<rect width="'+f3(w)+'" height="'+f3(h)+'" fill="#fff"/>';
  lines.forEach((a,key) => {
    const [lw,c,dash] = key.split('|');
    body += '<path d="'+a.join('')+'" fill="none" stroke="'+c+'" stroke-width="'+lw+'"'+(dash ? ' stroke-dasharray="'+dash+'"' : '')+'/>';
  });
  dots.forEach((a,key) => {
    const [r,c] = key.split('|');
    body += '<path d="'+a.join('')+'" fill="none" stroke="'+c+'" stroke-width="'+f3(r*2)+'" stroke-linecap="round"/>';
  });
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+f3(w)+' '+f3(h)+'" role="img" aria-label="Page preview">'+body+shapes+'</svg>';
}

const clean = t => String(t).replace(/[^\x20-\x7E -ÿ]/g,'?');

function drawOps(doc,ops){
  let dc = '', fc = '', lw = -1, dash = '';
  const stroke = (c,w,d) => {
    if(c !== dc){ const [r,g,b] = hexToRgb(c); doc.setDrawColor(r,g,b); dc = c; }
    if(w !== lw){ doc.setLineWidth(w); lw = w; }
    const ds = d ? d.join(',') : '';
    if(ds !== dash){ doc.setLineDashPattern(d || [], 0); dash = ds; }
  };
  for(const o of ops){
    if(o.k === 'l'){ stroke(o.c,o.w,o.dash); doc.line(o.x1,o.y1,o.x2,o.y2); }
    else if(o.k === 'd'){
      if(o.c !== fc){ const [r,g,b] = hexToRgb(o.c); doc.setFillColor(r,g,b); fc = o.c; }
      doc.circle(o.x,o.y,o.r,'F');
    }
    else if(o.k === 'r'){ stroke(o.c,o.lw,o.dash); doc.rect(o.x,o.y,o.w,o.h,'S'); }
    else if(o.k === 'o'){ stroke(o.c,o.lw,null); doc.circle(o.x,o.y,o.r,'S'); }
    else if(o.k === 't'){
      const [r,g,b] = hexToRgb(o.c);
      doc.setFont(pdfFont(doc, o.f), o.b ? 'bold' : 'normal'); doc.setFontSize(o.size); doc.setTextColor(r,g,b);
      doc.text(clean(o.s), o.x, o.y, {align: o.a==='c' ? 'center' : o.a==='r' ? 'right' : 'left'});
    }
  }
  doc.setLineDashPattern([],0);
}

/* The PDF name of a font: built-in ones by name, loaded ones once added to this
   document, anything that failed to load falls back to Helvetica. */
function pdfFont(doc,k){
  const f = FONTS[k];
  if(!f) return 'helvetica';
  if(f.pdf) return f.pdf;
  return doc.__jl && doc.__jl[k] ? 'jl-'+k : 'helvetica';
}
const FONT_DATA = {}, FONT_WAIT = {};
function b64(buf){
  const u = new Uint8Array(buf); let bin = '';
  for(let i=0; i<u.length; i+=0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i+0x8000));
  return btoa(bin);
}
/* Fetch a font's regular and bold files once, for both the preview and the PDF. */
function loadFont(k){
  const f = FONTS[k];
  if(!f || !f.file) return Promise.resolve(true);
  if(FONT_DATA[k]) return Promise.resolve(true);
  if(!FONT_WAIT[k]) FONT_WAIT[k] = Promise.resolve().then(() => Promise.all(['400Regular','700Bold'].map(w =>
      fetch(fontURL(f,w)).then(r => { if(!r.ok) throw new Error(r.status); return r.arrayBuffer(); }))))
    .then(([reg, bold]) => {
      FONT_DATA[k] = {reg:b64(reg), bold:b64(bold)};
      try{
        if(typeof FontFace === 'function' && document.fonts){
          const fam = f.css.split(',')[0].replace(/"/g,'');
          document.fonts.add(new FontFace(fam, reg, {weight:'400'}));
          document.fonts.add(new FontFace(fam, bold, {weight:'700'}));
        }
      }catch(e){ console.warn('Preview font', e); }
      return true;
    })
    .catch(e => { console.warn('Font', k, e); delete FONT_WAIT[k]; return false; });
  return FONT_WAIT[k];
}
const fontsOf = s => [...new Set([s.headFont, s.textFont])].filter(k => FONTS[k] && FONTS[k].file);
let fontWarned = {};
function fontsForPreview(){
  for(const k of fontsOf(S)) if(!FONT_DATA[k]) loadFont(k).then(ok => {
    if(ok) update();
    else if(!fontWarned[k]){ fontWarned[k] = true; toast(FONTS[k].l.split(' (')[0]+' could not load, so pages use Helvetica for now'); }
  });
}
function addFonts(doc,s){
  doc.__jl = {};
  for(const k of fontsOf(s)){
    const d = FONT_DATA[k]; if(!d) continue;
    try{
      doc.addFileToVFS('jl-'+k+'.ttf', d.reg); doc.addFont('jl-'+k+'.ttf', 'jl-'+k, 'normal');
      doc.addFileToVFS('jl-'+k+'-b.ttf', d.bold); doc.addFont('jl-'+k+'-b.ttf', 'jl-'+k, 'bold');
      doc.__jl[k] = true;
    }catch(e){ console.warn('Font', k, e); }
  }
}
async function makePDF(s,onProgress){
  const pl = plan(s), JS = window.jspdf.jsPDF;
  const fmt = [Math.min(pl.sw,pl.sh), Math.max(pl.sw,pl.sh)], ori = pl.landscape ? 'landscape' : 'portrait';
  const doc = new JS({unit:'mm', format:fmt, orientation:ori, compress:true});
  if(fontsOf(s).length){ await Promise.all(fontsOf(s).map(loadFont)); addFonts(doc,s); }
  doc.setProperties({title:'Journal pages', creator:'Journal Lab'});
  for(let i=1;i<=pl.sheets;i++){
    if(i > 1) doc.addPage(fmt, ori);
    drawOps(doc, buildSheet(s,pl,i,false,false));
    if(onProgress) onProgress(i,pl.sheets);
    if(i % 2 === 0) await new Promise(r => setTimeout(r,0));
  }
  return doc;
}

function makeTestPDF(s){
  const pl = plan(s), P = PAPERS[s.paper], JS = window.jspdf.jsPDF;
  const fmt = [P.w, P.h], ori = pl.landscape ? 'landscape' : 'portrait';
  const doc = new JS({unit:'mm', format:fmt, orientation:ori, compress:true});
  doc.setProperties({title:'Printer test', creator:'Journal Lab'});
  const name = P.l+' '+ori;
  drawOps(doc, buildTestSheet(pl.sw, pl.sh, false, name));
  doc.addPage(fmt, ori);
  drawOps(doc, buildTestSheet(pl.sw, pl.sh, true, name));
  return doc;
}

/* Share links: the setup rides in the link after #s= as base64url JSON. Printer
   settings (margin, double-sided, calibration) belong to one printer, so they stay out. */
const SITE = 'https://docgonzo420.github.io/Journal-Lab/';
const PRINTER_KEYS = ['sheetMargin','duplex'].concat(CAL_KEYS);
function shareData(s){ const d = diff(s); for(const k of PRINTER_KEYS) delete d[k]; return d; }
function encodeShare(o){
  const b = new TextEncoder().encode(JSON.stringify(o));
  let bin = ''; for(const x of b) bin += String.fromCharCode(x);
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeShare(t){
  const m = /#s=([A-Za-z0-9_-]+)/.exec(t || ''); if(!m) return null;
  const bin = atob(m[1].replace(/-/g,'+').replace(/_/g,'/'));
  const o = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
  if(!o || typeof o !== 'object' || Array.isArray(o)) return null;
  for(const k of PRINTER_KEYS) delete o[k];
  return o;
}
function shareBase(){
  const l = typeof location !== 'undefined' ? location : null;
  return l && l.protocol === 'https:' && /\.github\.io$/.test(l.hostname) ? l.origin + l.pathname : SITE;
}

function el(tag,attrs){
  const e = document.createElement(tag);
  for(const k of Object.keys(attrs || {})){
    const v = attrs[k];
    if(v === false || v == null) continue;
    if(k === 'class') e.className = v;
    else if(k.slice(0,2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for(let i=2;i<arguments.length;i++){
    const kids = [].concat(arguments[i]);
    for(const kd of kids) if(kd != null && kd !== false) e.append(kd.nodeType ? kd : document.createTextNode(kd));
  }
  return e;
}

function calHint(s){
  if(!calOn(s)) return 'No correction yet. Pages print where the PDF puts them.';
  const f = calShift(s,false), b = calShift(s,true), mv = d => {
    const p = [];
    if(Math.abs(d.x) > 1e-9) p.push(fmtLen(Math.abs(d.x))+' '+S.unit+(d.x > 0 ? ' right' : ' left'));
    if(Math.abs(d.y) > 1e-9) p.push(fmtLen(Math.abs(d.y))+' '+S.unit+(d.y > 0 ? ' down' : ' up'));
    return p.length ? p.join(' and ') : 'not at all';
  };
  const backs = isBooklet(s) || s.duplex;
  return 'The PDF moves fronts '+mv(f)+(backs ? ' and backs '+mv(b) : '')+' to cancel your printer\'s shift. The preview stays centred.'
    +(backs ? '' : ' Back corrections apply only to booklets, or when the double-sided box is ticked.');
}

function holesHint(s){
  const H = holesOf(s); if(!H) return '';
  const side = s.mirror ? 'binding edge (left on odd pages, right on even pages)' : 'left edge';
  const keep = 'Page content stays at least '+fmtLen(holeZone(s))+' '+s.unit+' clear of that edge.';
  if(!H.gaps) return 'Disc punches set their own spacing, so only a light line at the punch depth is printed, on the '+side+'. '+keep;
  const {ys, all} = holeYs(s);
  const fit = ys.length < all ? ' Only '+ys.length+' of '+all+' holes fit on this page height, so check it matches your rings.' : '';
  return 'Marks show where to punch '+all+' holes on the '+side+'. '+keep+' Print at 100% so the marks line up with your rings, and try one page against a refill first.'+fit;
}
function datedHint(s){
  if(!isDated(s)) return '';
  const n = pageCount(s), cal = hasMonthCal(s);
  const a = pageInfo(s, cal ? 2 : 1), b = pageInfo(s, n);
  const name = i => i.week ? MONTHS[i.week.getUTCMonth()]+' '+i.week.getUTCDate() : i.label;
  if(s.mix){
    const out = []; let off = 0;
    for(const pt of s.parts){
      if(datedTpl(s, pt.tpl)){
        const x = pageInfo(s, off+1), y = pageInfo(s, off+pt.n);
        out.push(tplName(pt.tpl)+': '+(x.label === y.label ? x.label : x.week ? 'weeks starting '+name(x)+' to '+name(y) : x.label+' to '+y.label));
      }
      off += pt.n;
      if(out.length === 6) break;
    }
    return (s.startDate ? '' : 'No start date set, so it uses the current month. ')+out.join('. ')+'. Each dated part carries on from the last part of the same type.';
  }
  const range = n > (cal ? 1 : 0)
    ? (a.week ? (a.label === b.label ? 'the week of '+name(a) : 'weeks starting '+name(a)+' to '+name(b))
              : a.label === b.label ? a.label : a.label+' to '+b.label) : '';
  const lead = s.startDate ? '' : 'No start date set, so it uses the current month. ';
  return lead+(cal ? 'Page 1 is the '+pageInfo(s,1).label+' calendar'+(range ? ', then ' : '.') : '')
    +(range ? range+'.' : '')+' '+n+' page'+(n === 1 ? '' : 's')+'.';
}
function partsHint(s){
  const n = pageCount(s);
  return 'The PDF prints these parts in order, '+n+' page'+(n === 1 ? '' : 's')+' in all. Each type uses its own settings in this section, and the header, margins and colour apply to every page.';
}
function trackHint(s){
  const out = [];
  if(uses(s,'habit')){
    const R = contentRect(s,1), cw = (R.w - clamp(R.w*0.28, 18, 45))/31;
    out.push('Habit tracker: write a habit on each row and fill in a box each day you do it. Row height sets how many rows fit.'
      +(cw < 3 ? ' The day boxes are narrow at this page width; landscape gives them more room.' : ''));
  }
  if(uses(s,'tracker')) out.push(s.trackKind === 'mood' ? 'Mood tracker: one row per day; fill in a circle from 1 (low) to 5 (high) and add a note.'
    : s.trackKind === 'reading' ? 'Reading log: one book per row, with dates and a rating.' : 'Log: write the date on the left and the entry beside it.');
  if((uses(s,'habit') || (uses(s,'tracker') && s.trackKind === 'mood')) && !isDated(s)) out.push('Tick Fill in real dates to print the month and its days.');
  return out.join(' ');
}
function bookletHint(s){
  const pl = plan(s), B = pl.booklet;
  if(!B) return '';
  const flip = pl.landscape ? 'short' : 'long';
  const piles = pl.per > 1
    ? 'Cut the stack at the cut marks, keeping each pile in printed order with sheet 1 on the outside. Nest the piles in reading order, the top-left pile outermost. '
    : 'Keep the sheets in printed order with sheet 1 on the outside. ';
  return 'Print double-sided, flipping on the '+flip+' edge. '+piles+'Fold at the ticks and staple along the fold. '
    +B.pages+' pages on '+B.folios+' folded sheet'+(B.folios === 1 ? '' : 's')+'. Print one sheet first to check the two sides line up.';
}
const read = c => c.get ? c.get(S) : S[c.key];
const write = (c,v) => { if(c.set) c.set(S,v); else S[c.key] = v; };
const FIELDS = [];

function commit(c){
  if(c && c.after) c.after();
  S = sanitize(S);
  syncAll(); vis(); update();
}

function makeField(c){
  const id = 'f_'+c.id;
  const wide = !['len','num'].includes(c.t);
  const wrap = el('div', {class:'field'+(wide?' wide':''), 'data-id':c.id});
  const labText = () => typeof c.label === 'function' ? c.label(S) : c.label;
  const lab = c.label ? el('label', {class:'lab', for:id}, labText()) : null;
  const F = {c, wrap, sync(){}};

  switch(c.t){
    case 'select': {
      const sel = el('select', {id});
      if(c.opts === 'presets'){
        for(const g of PRESETS){
          const og = el('optgroup', {label:g.g});
          for(const it of g.items) og.append(el('option', {value:it.k}, it.l));
          sel.append(og);
        }
      } else for(const [v,l] of c.opts) sel.append(el('option', {value:v}, l));
      sel.addEventListener('change', () => { write(c, c.numeric ? +sel.value : sel.value); commit(c); });
      wrap.append(lab, sel);
      F.sync = () => { sel.value = String(read(c)); };
      break;
    }
    case 'seg': {
      const row = el('div', {class:'seg', role:'group', 'aria-label':c.label});
      const btns = c.opts.map(([v,l]) => el('button', {type:'button', 'data-v':v, 'aria-pressed':'false',
        onclick:() => { write(c,v); commit(c); }}, l));
      row.append(...btns);
      wrap.append(el('span', {class:'lab'}, c.label), row);
      F.sync = () => btns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === String(read(c)))));
      break;
    }
    case 'len': {
      const inp = el('input', {id, type:'number', inputmode:'decimal', step:'any'});
      const u = el('span', {class:'unit'});
      const apply = final => {
        let v = parseFloat(inp.value);
        if(!isFinite(v)){ if(final) inp.value = disp(read(c)); return; }
        let mm = v*unitDiv();
        if(mm < c.min - 1e-9 || mm > c.max + 1e-9){ if(!final) return; mm = clamp(mm, c.min, c.max); }
        write(c, mm); commit(c);
        if(final) inp.value = disp(read(c));
      };
      inp.addEventListener('input', () => apply(false));
      inp.addEventListener('change', () => apply(true));
      wrap.append(lab, el('div', {class:'inwrap'}, inp, u));
      F.sync = () => { const v = read(c); if(document.activeElement !== inp) inp.value = v == null ? '' : disp(v); u.textContent = S.unit; if(lab) lab.textContent = labText(); };
      break;
    }
    case 'num': {
      const inp = el('input', {id, type:'number', inputmode:'numeric', step:1});
      const apply = final => {
        let v = parseFloat(inp.value);
        if(!isFinite(v)){ if(final) inp.value = read(c); return; }
        if(v < c.min || v > c.max){ if(!final) return; v = clamp(v, c.min, c.max); }
        write(c, Math.round(v)); commit(c);
        if(final) inp.value = read(c);
      };
      inp.addEventListener('input', () => apply(false));
      inp.addEventListener('change', () => apply(true));
      wrap.append(lab, inp);
      F.sync = () => { if(document.activeElement !== inp) inp.value = read(c); if(lab) lab.textContent = labText(); };
      break;
    }
    case 'range': {
      const inp = el('input', {id, type:'range', min:c.min, max:c.max, step:c.step});
      const out = el('output', {for:id});
      inp.addEventListener('input', () => { write(c, +inp.value); commit(c); });
      wrap.append(lab, el('div', {class:'rangerow'}, inp, out));
      F.sync = () => { inp.value = read(c); out.textContent = c.fmt(S); if(lab) lab.textContent = labText(); };
      break;
    }
    case 'text': {
      const inp = el('input', {id, type:'text', maxlength:60, placeholder:c.placeholder||'', autocomplete:'off'});
      inp.addEventListener('input', () => { write(c, inp.value); commit(c); });
      wrap.append(lab, inp);
      F.sync = () => { if(document.activeElement !== inp) inp.value = read(c); };
      break;
    }
    case 'date': {
      const inp = el('input', {id, type:'date'});
      const on = () => { write(c, inp.value); commit(c); };
      inp.addEventListener('change', on); inp.addEventListener('input', on);
      wrap.append(lab, inp);
      F.sync = () => { if(document.activeElement !== inp) inp.value = read(c) || ''; };
      break;
    }
    case 'check': {
      const inp = el('input', {id, type:'checkbox'});
      inp.addEventListener('change', () => { write(c, inp.checked); commit(c); });
      wrap.append(el('label', {class:'chk'}, inp, el('span', {}, c.label)));
      F.sync = () => { inp.checked = !!read(c); };
      break;
    }
    case 'color': {
      const row = el('div', {class:'sw-row'});
      const sws = COLORS.map(([hx,name]) => el('button', {type:'button', class:'sw', 'aria-label':name, title:name, 'data-c':hx,
        style:'background:'+hx, 'aria-pressed':'false', onclick:() => { write(c,hx); commit(c); }}));
      const pick = el('input', {id, type:'color', 'aria-label':'Custom colour'});
      pick.addEventListener('input', () => { write(c, pick.value); commit(c); });
      row.append(...sws, pick);
      wrap.append(el('span', {class:'lab'}, c.label), row);
      F.sync = () => { const v = read(c).toLowerCase(); sws.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.c === v))); pick.value = v; };
      break;
    }
    case 'parts': {
      // A row per part: page type, how many pages, and a Remove button.
      const list = el('div', {class:'parts', id});
      const add = el('button', {type:'button', class:'btn small', onclick:() => {
        if(S.parts.length >= 12) return;
        const last = S.parts[S.parts.length-1];
        S.parts.push({tpl:last ? last.tpl : 'dots', n:last ? last.n : 4}); commit(c);
      }}, 'Add pages');
      wrap.append(el('span', {class:'lab'}, c.label), list, add);
      let drawn = '';
      const draw = () => {
        list.textContent = '';
        S.parts.forEach((pt,k) => {
          const sel = el('select', {'aria-label':'Page type, part '+(k+1)});
          for(const t of TEMPLATES) sel.append(el('option', {value:t.v}, t.l));
          sel.value = pt.tpl;
          sel.addEventListener('change', () => { S.parts[k].tpl = sel.value; commit(c); });
          const inp = el('input', {type:'number', inputmode:'numeric', step:1, min:1, max:200, 'aria-label':'Pages in part '+(k+1)});
          inp.value = pt.n;
          inp.addEventListener('change', () => {
            const v = parseFloat(inp.value);
            if(isFinite(v)) S.parts[k].n = Math.round(clamp(v, 1, 200));
            commit(c); inp.value = S.parts[k] ? S.parts[k].n : '';
          });
          const rm = el('button', {type:'button', class:'btn small', 'aria-label':'Remove part '+(k+1), disabled:S.parts.length < 2,
            onclick:() => { if(S.parts.length > 1){ S.parts.splice(k,1); commit(c); } }}, 'Remove');
          list.append(el('div', {class:'part-row'}, el('span', {class:'part-n'}, String(k+1)), sel, inp, rm));
        });
      };
      F.sync = () => {
        const now = JSON.stringify(S.parts);
        if(now !== drawn){ drawn = now; draw(); }
        add.disabled = S.parts.length >= 12;
      };
      break;
    }
    case 'button': {
      wrap.append(el('button', {type:'button', id, class:'btn small', onclick:c.run}, c.label));
      F.sync = () => {};
      break;
    }
    case 'hint': {
      const txt = () => typeof c.text === 'function' ? c.text(S) : c.text;
      const p = el('p', {class:'hint'}, txt());
      wrap.append(p);
      F.sync = () => { p.textContent = txt(); };
      break;
    }
  }
  return F;
}

function buildControls(){
  const host = $('#controls');
  for(const sec of SECTIONS){
    const det = el('details', {class:'sec', open:!!sec.open});
    det.append(el('summary', {}, sec.t));
    const body = el('div', {class:'sec-body'});
    for(const c of sec.c){ const F = makeField(c); FIELDS.push(F); body.append(F.wrap); }
    det.append(body); host.append(det);
  }
  host.append(buildSaveSection());
}

function syncAll(){ for(const F of FIELDS) F.sync(); refreshJson(); }
function vis(){ for(const F of FIELDS) F.wrap.hidden = F.c.show ? !F.c.show(S) : false; }

function printerOf(s){ const o = {}; for(const k of PRINTER_KEYS) o[k] = s[k]; return o; }

function loadSettings(o,keepSheet){

  if(keepSheet) for(const k of CAL_KEYS) keep[k] = S[k];

  syncAll(); vis(); update();
